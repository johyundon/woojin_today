<script type="text/javascript" nonce="x">

	$(document).ready(function(){
		if($(".stdFile").length == 0){
			$("#fileUploadForm").show();
		}else{
			$("#fileUploadForm").hide();
		}
	});


	function fnClosePop() {
		if( $(".attach_file_box input").length > 1 ){
			// 파일 업로드
			if (confirm("첨부파일을 저장하시겠습니까?")) {
				var _url = "https://together.daejin.ac.kr:443/cnsHis/w/n/createOnCnsStdFileAttach.do";
				$("#fileUploadForm").ajaxForm({
					url : _url,
					type : "POST",
					dataType : "json",
					success : function(res){
						if (res.rtnCode == "0") {
							alert("첨부파일 업로드에 성공하였습니다.");
							$("#closePopBtn").trigger('click');
						}else{
							alert("첨부파일 업로드에 실패하였습니다.(2)");
						}
					},
					clearForm : false,
					resetForm : false,
					semantic : false,
					error : function(_xmlHttpRequest, _stateMessage, _errorObject) {
						alert("첨부파일 업로드에 실패하였습니다.(1)");
					}
				});
				$("#fileUploadForm").submit();
			}
		}else{
			$("#closePopBtn").trigger('click');
		}
	}


	function fnDelAddFileDataForCnsHis(objId, fileSubId, staffType) {
		if(confirm("첨부파일을 삭제하시겠습니까?")){
			if(isEmpty(fileSubId) == false) {
				var basePath = sessionStorage.getItem("contextRootPath");
				var _url = basePath+"/cmm/fms/removeFileData.do";
				jQuery.ajax({
					type: "POST",
					url: _url,
					dataType: "json",
					data : {
						fileSubId   : fileSubId
					},
					success: function(r) {
						if (r.rtnCode == '0') {
							if(staffType == 'CLIENT'){
								var delObjId = objId.replace('_del','');
								$("#"+delObjId+"_link_file_delDiv").remove();
								$("#"+delObjId).remove();
								$("#fileUploadForm").show();
							}else{
								var delObjId = objId.replace('_del','');
								$("#"+objId).parent(".file_thumbnail").remove();
								$("#"+delObjId).remove();
							}
						} else {
							 alert("첨부파일 삭제에 실패 하였습니다.");
							 return false;
						}
					},error: function(r) {
					}
				});

			}else{
				if(staffType == 'CLIENT'){
					var delObjId = objId.replace('_del','');
					$("#"+delObjId+"_link_file_delDiv").remove();
					$("#"+delObjId).remove();
				}else{
					var delObjId = objId.replace('_del','');
					$("#"+objId).parent(".file_thumbnail").remove();
					$("#"+delObjId).remove();
				}
			}
		}
	}

</script>
