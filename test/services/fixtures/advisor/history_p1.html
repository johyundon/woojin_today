<script type="text/javascript" nonce="x">

	$(document).ready( function() {

	});

	function fnCancelCnsSts(_cnsApplyKeyId, _cnsOnoffDiv, _csaResrvCnlsrId, _csaResrvDate, _csaResrvTime, _csmKeyId, _cnsDiv) {
		//지도교수 상담 취소 1일이전부터 불가 로직
		var splitResrvDate = _csaResrvDate.split('-');

		var resrvDate = new Date(splitResrvDate[0],splitResrvDate[1]-1,splitResrvDate[2])
		resrvDate.setDate(resrvDate.getDate() - 1);

		var nowDate = new Date('2026','10'-1,'31');

		if('CNSGB01' == 'CNSGB01'){
			if(nowDate >= resrvDate){
				alert("예약상담 1일 이전부터 취소하실 수 없습니다.");
				return false;
			}
		}
		if(confirm("상담 신청을 취소하시겠습니까?")) {
			$.ajax({
				url : "https://together.daejin.ac.kr:443/cnsHis/w/n/getCnsCancelAjax.do"
				, type : "post"
				, dataType : "json"
				, data : {
					cnsKeyId     : _cnsApplyKeyId
					,cnsOnoffDiv : _cnsOnoffDiv
					,cnsDiv      : _cnsDiv
					,resvDate    : _csaResrvDate
					,coaResrvTime    : _csaResrvTime
					,coaResrvCnlsrId : _csaResrvCnlsrId
					,csmKeyId		 : _csmKeyId
				}
				, success : function(res) {
					if (res.rtnCode == '0') {
						alert('상담이 취소되었습니다.');
						fnSearchList(1);

					}else {
						alert('상담취소에 실패하였습니다.\n잠시 후 다시 시도해주세요.');
					}
				}
			});
		}
	}

	
	function fnGetCnsDetailInfo(_cnsKeyId, _cnsOnoffDiv, _cnsDiv) {
		$.ajaxSetup({ cache : false });
		var popupDivId = "#layerPopup";
		var popupUrl = "https://together.daejin.ac.kr:443/cnsHis/a/n/getCnsDetailInfoPop.do"
		var popupParams = {
				cnsKeyId     : _cnsKeyId
				,cnsOnoffDiv : _cnsOnoffDiv
				,cnsDiv      : _cnsDiv
		}
		clientLoadPopup(popupDivId, popupUrl, popupParams);
	}

	
	function fnSatisPop(_cnsState, _cnsApplyKeyId) {

		
		if (_cnsState != 'SCHSTS02') {
			alert("상담완료 후 만족도 조사가 가능합니다.");
			return false;
		}


		$.ajaxSetup({cache:false});
		var popupDivId = "#layerPopup"; // 팝업이 들어가는 div의 id

		var popupUrl = "https://together.daejin.ac.kr:443/cnsHis/a/n/getCnsSurveyPopUp.do"; // 팝업 내용을 호출하는 url
		var popupParams = {
				cnsApplyKeyId : _cnsApplyKeyId
			}; // 팝업 호출시의 파라미터
		clientLoadPopup (popupDivId, popupUrl, popupParams);

	}

	function fnSatisPopOnline(_cnsState, _cnsApplyKeyId) {

		
		if (_cnsState != 'ONSTS02') {
			alert("상담완료 후 만족도 조사가 가능합니다.");
			return false;
		}

		$.ajaxSetup({cache:false});
		var popupDivId = "#layerPopup"; // 팝업이 들어가는 div의 id

		var popupUrl = "https://together.daejin.ac.kr:443/cnsHis/a/n/getCnsSurveyOnlinePopUp.do"; // 팝업 내용을 호출하는 url
		var popupParams = {
				cnsApplyKeyId : _cnsApplyKeyId
			}; // 팝업 호출시의 파라미터
		clientLoadPopup (popupDivId, popupUrl, popupParams);

	}

</script>
