<script type="text/javascript" nonce="x">

$(document).ready(function(event) {

});



function fnSearchBtn() {
	fnGetProfList(1);
}


function fnGetProfList(pageNo) {
	$('#pageIndex').val(pageNo);
	var searchSel = $("option:selected");
	var searchText = $("#searchText").val();

	$.ajax({
		url : "https://together.daejin.ac.kr:443/profCns/a/n/getProfSearchListPop.do"
		, type : "post"
		, dataType : "html"
		, data : $('#searchForm').serialize()
		, success : function(res) {
			$("#profSearchPopDiv").html(res);
			$("#searchText").attr('name',searchSel.val());
			$("#labelText").text(searchSel.text());
			$("#searchText").val(searchText);
		}
	});
}



function fnSettingLableTxt(_obj) {
	var labelTxt = $(_obj).children('option:selected').text();
	$(_obj).siblings('label').text(labelTxt);
}



function fnSetProfInfo(_staffNo, _korNm) {
	$('input[name=comProfId]').val(_staffNo);
	$('input[name=coaResrvCnlsrId]').val(_staffNo);
	$('#cnsNm').text(_korNm);
	$('#popCloseBtn').trigger('click');
}

function fnSetSearchTextNm(selvalue) {
	$("#searchText").attr("name", selvalue);

}

</script>
